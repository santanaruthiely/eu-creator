function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
}

function formatDateFull(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
}

function nextId(arr) {
  return arr.length > 0 ? Math.max(...arr.map(i => i.id)) + 1 : 1;
}

function connectGmail() {
  if (typeof google === 'undefined' || !google.accounts) {
    alert('A biblioteca do Google ainda não carregou. Aguarde alguns segundos e tente novamente.');
    return;
  }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: '281420955340-nkbc7kcr0e52h0roe2c0bf5716goijao.apps.googleusercontent.com',
    scope: 'https://www.googleapis.com/auth/gmail.readonly',
    callback: (tokenResponse) => {
      if (tokenResponse.error) {
        alert('Erro ao conectar: ' + tokenResponse.error);
        return;
      }
      gmailToken = tokenResponse.access_token;
      gmailConnected = true;
      fetchGmailEmails(gmailToken);
    },
  });
  client.requestAccessToken();
}

async function fetchGmailEmails(token) {
  try {
    const url = 'https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=20&q=from:youtube.com OR from:adsense.google.com OR from:google.com';
    const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) {
      alert('Erro ao buscar e-mails: ' + res.status);
      return;
    }
    const data = await res.json();
    if (!data.messages || data.messages.length === 0) {
      gmailEmails = [];
      render();
      return;
    }
    const emails = [];
    for (const msg of data.messages) {
      const detailRes = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${msg.id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const detail = await detailRes.json();
      const headers = {};
      (detail.payload?.headers || []).forEach(h => { headers[h.name.toLowerCase()] = h.value; });
      const from = headers['from'] || 'Desconhecido';
      const subject = headers['subject'] || '(sem assunto)';
      const dateRaw = headers['date'] || '';
      const date = new Date(dateRaw);
      const dataStr = isNaN(date.getTime()) ? dateRaw : date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
      let tipo = 'canal';
      const fromLower = from.toLowerCase();
      if (fromLower.includes('youtube')) tipo = 'youtube';
      else if (fromLower.includes('adsense')) tipo = 'adsense';
      else if (fromLower.includes('google')) tipo = 'google';
      emails.push({
        id: msg.id,
        de: from,
        assunto: subject,
        data: dataStr,
        resumo: detail.snippet || '',
        lido: !(detail.labelIds || []).includes('UNREAD'),
        tipo: tipo,
        cor: tipo === 'youtube' ? '#F9E0E0' : tipo === 'adsense' ? '#F3EBCB' : tipo === 'google' ? '#E6EEF0' : '#F5E4D8',
      });
    }
    gmailEmails = emails;
    render();
  } catch(e) {
    alert('Erro ao buscar e-mails: ' + e.message);
  }
}

function disconnectGmail() {
  gmailToken = null;
  gmailConnected = false;
  gmailEmails = [];
  render();
}

function esconderEmailReal(id) {
  gmailEmails = gmailEmails.filter(e => e.id !== id);
  render();
}

    { id: 14, categoria: 'Instagram', titulo: 'Diretrizes da comunidade', url: 'https://help.instagram.com/477434105621119', descricao: 'Regras de conteúdo e comportamento no Instagram.' },

  const filtrados = links.filter(l => {
    const b = infoBusca.toLowerCase();

    const matchCat = infoCategoria === 'todas' || l.categoria === infoCategoria;
    return matchBusca && matchCat;
  });

    <div>

          ${['todas','YouTube','TikTok','Instagram','AdSense'].map(cat => `
            <button class="chip ${infoCategoria===cat?'sky active':''}" onclick="infoCategoria='${cat}';render()">${cat==='todas'?'Todas':cat}</button>
          `).join('')}
        </div>
      </div>
    </div>
    ${['YouTube','TikTok','Instagram','AdSense'].map(cat => {
      const itens = filtrados.filter(l => l.categoria === cat);
      if (!itens.length) return '';
      const icon = cat==='AdSense'?'💰':cat==='YouTube'?'▶️':cat==='TikTok'?'🎵':'📸';
      return `
        <h4 class="card-title mt-3">${icon} ${cat==='AdSense'?'Google AdSense':cat}</h4>
        ${itens.map(l => `
          <a class="link-card" href="${l.url}" target="_blank" rel="noreferrer">

              <span class="text-xs" style="color:#0284c7;">Abrir ↗</span>
            </div>

        `).join('')}
      `;
    }).join('')}
    ${filtrados.length === 0 ? '<div class="card"><p class="text-sm text-muted">Nenhum link encontrado.</p></div>' : ''}
  `;
}

  });
  saveState(); render();

function openEditModal(tipo, id) {

  else if (tipo === 'projeto') dados = JSON.parse(JSON.stringify(state.agencyProjetos.find(p => p.id === id)));

  render();

function closeModal() { modalEdit = null; render(); }

  // Vamos refazer:

// ============ UPLOAD DE FOTO ============
function handleFotoUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    modalEdit.dados.foto = e.target.result;
    saveState();
    render();
  };
  reader.readAsDataURL(file);
}

function removerFotoCanal() {
  modalEdit.dados.foto = null;
  saveState();
  render();
}

// ============ YOUTUBE ============
function formatNumber(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return n.toLocaleString('pt-BR');
}

async function fetchChannelStats(channelId) {
  const url = `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${channelId}&key=${encodeURIComponent(youtubeApiKey)}`;
  const res = await fetch(url);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || ('HTTP ' + res.status));
  }
  const data = await res.json();
  return (data.items || [])[0];
}

async function buscarMetricaCanal(channelId) {
  if (!youtubeApiKey) {
    alert('⚠️ Configure sua API Key do YouTube no módulo ⚡ YouTube primeiro.');
    return;
  }
  youtubeLoading = true; render();
  try {
    const item = await fetchChannelStats(channelId);
    if (!item) {
      alert('Canal não encontrado para o ID:\n' + channelId);
    } else {
      const st = item.statistics || {};
      state.youtubeMetricas[channelId] = {
        inscritos: parseInt(st.subscriberCount || '0', 10),
        visualizacoes: parseInt(st.viewCount || '0', 10),
        videos: parseInt(st.videoCount || '0', 10),
        atualizadoEm: new Date().toLocaleString('pt-BR'),
      };
      youtubeLastUpdate = new Date().toLocaleString('pt-BR');
    }
  } catch(e) {
    alert('Erro ao buscar métricas: ' + e.message + '\nVerifique a API Key e tente novamente.');
  }
  youtubeLoading = false;
  saveState(); render();
}

async function buscarMetricasYouTube() {
  if (!youtubeApiKey) {
    alert('⚠️ Configure sua API Key do YouTube primeiro.');
    return;
  }
  youtubeLoading = true; render();
  try {
    for (const c of youtubeCanais) {
      try {
        const item = await fetchChannelStats(c.id);
        if (item) {
          const st = item.statistics || {};
          state.youtubeMetricas[c.id] = {
            inscritos: parseInt(st.subscriberCount || '0', 10),
            visualizacoes: parseInt(st.viewCount || '0', 10),
            videos: parseInt(st.videoCount || '0', 10),
            atualizadoEm: new Date().toLocaleString('pt-BR'),
          };
        }
      } catch(e) {
        console.warn('Falha ao buscar ' + c.nome, e);
      }
    }
    youtubeLastUpdate = new Date().toLocaleString('pt-BR');
    alert('✅ Busca concluída! Os dados reais que consegui buscar estão no módulo.');
  } catch(e) {
    alert('Erro ao buscar métricas: ' + e.message);
  }
  youtubeLoading = false;
  saveState(); render();
}

render();
